name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msvc:
    name: Windows (MSVC x64)
    runs-on: windows-latest
    permissions:
      contents: write  # タグ push 時にリリースを作成するため
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-windows-x64
          path: build/Release/AutoClicker.exe

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: オートクリッカー ${{ github.ref_name }}
          body_path: .github/release_body.md
          files: build/Release/AutoClicker.exe

  mingw:
    name: Cross-compile (MinGW-w64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j
