name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "リリースを作成する場合はバージョンを入力（例: v1.0.0）。空欄ならビルドのみ"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  msvc:
    name: Windows (MSVC x64)
    runs-on: windows-latest
    permissions:
      contents: write  # リリースを作成するため
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-windows-x64
          path: build/Release/AutoClicker.exe

      # v で始まるタグを push したとき、または手動実行でバージョンを入力したときにリリースを作成する
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: オートクリッカー ${{ inputs.release_tag || github.ref_name }}
          body_path: .github/release_body.md
          files: build/Release/AutoClicker.exe

  mingw:
    name: Cross-compile (MinGW-w64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j
